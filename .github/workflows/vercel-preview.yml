name: Vercel Preview

on:
  push:
    branches:
      - feat/figma-approved-implementation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Verify required Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ] || missing+=("VERCEL_TOKEN")
          [ -n "$VERCEL_ORG_ID" ] || missing+=("VERCEL_ORG_ID")
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=("VERCEL_PROJECT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required GitHub Actions secret: %s\n' "${missing[@]}"
            exit 1
          fi
          echo "Required Vercel credentials are available."

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@64.2.0

      - name: Pull preview configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview

      - name: Build preview
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          deployment_url="$(vercel deploy --prebuilt)"
          node -e 'const u=new URL(process.argv[1]); if(u.protocol!=="https:" || !u.hostname.endsWith(".vercel.app")) process.exit(1)' "$deployment_url"
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$deployment_url" > deployment-url.txt

      - name: Validate preview response
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl --fail --silent --show-error --location "$PREVIEW_URL" > preview.html
          grep -q "SUA ARTE" preview.html
          grep -q "PENDENTE DE DEFINIÇÃO KARV" preview.html

      - name: Save deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-url
          path: deployment-url.txt
          if-no-files-found: error
          retention-days: 14
