name: Vercel Preview

on:
  push:
    branches:
      - feat/figma-approved-implementation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Verify Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not available to the preview environment."
            exit 1
          fi
      - name: Deploy preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest deploy             --yes             --token="$VERCEL_TOKEN"             > deployment-url.txt
          cat deployment-url.txt
      - name: Validate preview response
        run: |
          PREVIEW_URL="$(tail -n 1 deployment-url.txt)"
          curl --fail --silent --show-error --location "$PREVIEW_URL" > preview.html
          grep -q "SUA ARTE" preview.html
          grep -q "PENDENTE DE DEFINIÇÃO KARV" preview.html
      - name: Save deployment metadata
        uses: actions/upload-artifact@v4
        with:
          name: vercel-preview-url
          path: deployment-url.txt
          retention-days: 14
